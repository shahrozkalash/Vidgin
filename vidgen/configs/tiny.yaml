# VidGen Configuration: Tiny Preset (~20M params)
# 64x64 resolution, 17 frames (T=4k+1, k=4), latent [B, 16, 5, 8, 8], 80 spacetime tokens
track: "A"
name: "tiny"
seed: 42

system:
  device: "cpu"          # "cpu", "cuda", or "auto"
  dtype: "float32"       # "float32" on CPU, "bfloat16" on GPU
  use_flash_attn: false  # Auto-falls back to standard PyTorch SDPA
  enable_tf32: false

vae:
  in_channels: 3
  latent_channels: 16
  base_channels: 32
  channel_multipliers: [1, 2, 4]
  temporal_downsamples: 2  # 4x temporal downsample: 17 -> 5 (t = (T-1)//4 + 1)
  spatial_downsamples: 3   # 8x spatial downsample: 64 -> 8

patchify:
  patch_size: [1, 2, 2]    # [pt, ph, pw]: 1 in time, 2 in height, 2 in width
  in_channels: 16

model:
  num_layers: 8
  hidden_dim: 384
  num_heads: 6             # head_dim = 64
  ffn_dim: 1536            # 4x hidden_dim
  text_dim: 384            # prompt projection dimension
  rope_theta: 10000.0
  dropout: 0.0

training:
  batch_size: 2
  micro_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  max_grad_norm: 1.0
  total_steps: 1000
  warmup_steps: 50
  save_every: 200
  eval_every: 50
  ema_decay: 0.999
  output_dir: "./checkpoints/tiny"
  tracker: "tensorboard"   # "tensorboard" or "wandb"

data:
  frames: 17              # T = 4*4 + 1
  height: 64
  width: 64
  fps: 8
  text_seq_len: 16

sampler:
  method: "euler"
  num_steps: 20
  guidance_scale: 5.0
